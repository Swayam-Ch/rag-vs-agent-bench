# The benchmark's answer key. Every method is scored against it.
#
# Rules for writing questions (see src/ragbench/eval/questions.py for the format):
# * Write the question AND its answer from the papers themselves, BEFORE running any
#   method on it. Never copy an answer from a method's output: that method would be
#   grading itself.
# * `gold` lists every paper (and the pages) a complete answer needs. A paper's pages
#   are alternatives: retrieving any one of them counts as finding it. If an answer
#   needs two separate facts from one paper, list that paper twice.
# * Quote arXiv IDs ("2005.11401"); unquoted, YAML reads them as numbers.
# * Prefer details a model is unlikely to remember: appendix numbers, footnotes,
#   "which papers in THIS collection", counts across papers.
# * Check it with:  ragbench questions
# * `author` says who wrote the question, so results can be split by author.
#
# Provenance: q001-q002 were written by Swayam. q003-q010 were drafted with an LLM on
# 2026-10-23 from the ingested text (data/processed), each with a short quote and page
# in its notes, and verified by Swayam against the PDFs. The same model family powers
# the agent being tested, so these questions favour details that are hard to know
# without reading THIS collection: counts across papers, setup details, tables.
version: 1
questions:
  - id: q001
    type: single_fact
    author: swayam
    question: How many parallel attention heads does the base Transformer model use?
    answer: 8 heads (h = 8), each with d_k = d_v = 64.
    gold:
      - paper: "1706.03762"
        pages: [5]
    notes: >
      Seed question, checked on the real corpus (BM25 rank 1 is the p.5 passage).
      Easy and famous: a model may answer it from memory, so it mainly tests retrieval.

  - id: q002
    type: single_fact
    author: swayam
    question: >
      In the Transformer's ablation study, what happens to translation quality as the
      number of attention heads grows, at constant computation?
    answer: >
      It improves from 1 head (24.9 BLEU on newstest2013) to a peak at 8-16 heads (25.8),
      then drops at 32 heads (25.4): too many heads hurt quality.
    gold:
      - paper: "1706.03762"
        pages: [9]
    notes: >
      Seed question (Table 3 rows (A), dev BLEU: 1 head 24.9, 4 heads 25.5, 8 heads 25.8,
      16 heads 25.8, 32 heads 25.4), checked in the ingested text of p.9.
      Worded without the paper's phrase "attention heads", vector search ranked the
      passage ~23rd in an earlier trial.

  - id: q003
    type: single_fact
    author: llm
    question: >
      How was the DPR model in the main experiments trained: what batch size, how many
      extra negative passages per question, and for how many epochs on the large datasets?
    answer: >
      In-batch negatives with a batch size of 128, plus one additional BM25 negative
      passage per question; up to 40 epochs for the large datasets (NQ, TriviaQA, SQuAD)
      and 100 epochs for the small ones (TREC, WQ).
    gold:
      - paper: "2004.04906"
        pages: [5]
    notes: >
      Drafted with an LLM. Quote (p.5): "trained using the in-batch negative setting
      (Section 3.2) with a batch size of 128 and one additional BM25 negative passage per
      question. We trained the question and passage encoders for up to 40 epochs for
      large datasets (NQ, TriviaQA, SQuAD) and 100 epochs for small datasets (TREC, WQ)".

  - id: q004
    type: single_fact
    author: llm
    question: >
      Roughly how many contractors were hired to write demonstrations, compare outputs
      and run the main evaluations for InstructGPT, and through which platforms?
    answer: About 40 contractors, hired on Upwork and through ScaleAI.
    gold:
      - paper: "2203.02155"
        pages: [7]
    notes: >
      Drafted with an LLM. Quote (p.7): "we hired a team of about 40 contractors on Upwork
      and through ScaleAI". p.19 repeats "We hired about 40 contractors" but not the
      platforms, so it is half the answer and deliberately not in gold (a gold page
      counts as finding the whole fact). Found when hybrid ranked p.19 first.

  - id: q005
    type: single_fact
    author: llm
    question: >
      How many annotated example trajectories per task type did ReAct use to prompt the
      model in ALFWorld, and where did they come from?
    answer: Three trajectories per task type, randomly chosen and annotated from the training set.
    gold:
      - paper: "2210.03629"
        pages: [7]
    notes: >
      Drafted with an LLM. Quote (p.7): "To prompt ReAct, we randomly annotate three
      trajectories from the training set for each task type".

  - id: q006
    type: multi_filter
    author: llm
    question: >
      Which papers in the collection report their own experimental results on Natural
      Questions (NQ)?
    answer: >
      Nine: REALM, DPR, RAG, GPT-3, BEIR, Contriever, Atlas, Toolformer and Lost in the
      Middle. Not counted: ColBERT ("Nq" there is a variable, not the dataset), Self-RAG
      (NQ is only part of its training mixture) and the RAG survey (it lists NQ in a table
      of datasets but runs no experiments).
    gold:
      - paper: "2002.08909"  # REALM, Table 1: NQ (79k/4k) column
        pages: [7]
      - paper: "2004.04906"  # DPR, 41.5 EM on open NQ
        pages: [8]
      - paper: "2005.11401"  # RAG, Table 2: RAG-Seq. 44.5
        pages: [6]
      - paper: "2005.14165"  # GPT-3, NQ 14.6 / 23.0 / 29.9 (zero/one/few-shot)
        pages: [13, 14]
      - paper: "2104.08663"  # BEIR, NQ row of the main results table
        pages: [7]
      - paper: "2112.09118"  # Contriever, Table 1: recall@k on NQ test
        pages: [7]
      - paper: "2208.03299"  # Atlas, 42.4% on NQ with 64 examples
        pages: [2]
      - paper: "2302.04761"  # Toolformer, Table 5: NQ 17.7
        pages: [7]
      - paper: "2307.03172"  # Lost in the Middle, task built from NaturalQuestions-Open
        pages: [3]
    notes: >
      Drafted by grepping every paper for "Natural Questions",
      "NaturalQuestions" and "NQ" and reading each match. An agent trial (before this key
      was written) answered 11, including Self-RAG and the survey: the exclusions above
      are the judgement calls to confirm.

  - id: q007
    type: multi_filter
    author: llm
    question: >
      Which papers use the FAISS library in their own system or experiments (not just
      mention it as background)?
    answer: >
      Four: DPR (FAISS index over the passages, HNSW), ColBERT (faiss IVFPQ index for
      end-to-end retrieval), RAG (a single MIPS index built with FAISS, HNSW) and BEIR
      (ColBERT's candidates retrieved with faiss). Contriever only mentions FAISS as an
      example of a k-nearest-neighbour library, so it doesn't count.
    gold:
      - paper: "2004.04906"
        pages: [3, 7]
      - paper: "2004.12832"
        pages: [5, 6]
      - paper: "2005.11401"
        pages: [4, 17]
      - paper: "2104.08663"
        pages: [6]
    notes: >
      Drafted with an LLM. Quotes: DPR p.3 "index them using FAISS (Johnson et al., 2017)
      offline"; ColBERT p.5 "we employ an off-the-shelf library ... namely faiss [15] from
      Facebook"; RAG p.4 "build a single MIPS index using FAISS [23] with a Hierarchical
      Navigable Small World approximation"; BEIR p.6 "top-k candidates are retrieved using
      ANN with faiss [29] (faiss depth = 100)". Excluded: Contriever p.3 "retrieval is
      performed with a fast k-nearest neighbors library such as FAISS".

  - id: q008
    type: cross_doc
    author: llm
    question: >
      DPR and Contriever both report BM25's top-20 retrieval accuracy on the Natural
      Questions test set. What value does each paper give, and why could they differ?
    answer: >
      DPR reports 59.1 (its own BM25 run); Contriever reports 62.9, taken from Ma et al.
      (2021). Required: both numbers, each with its paper. Optional (don't require it):
      why they differ, e.g. different BM25 implementations and settings, so they are not
      the same measurement; and the context that DPR trained on NQ gets 78.4 and
      unsupervised Contriever 67.8 at top-20.
    gold:
      - paper: "2004.04906"
        pages: [5]
      - paper: "2112.09118"
        pages: [7]
    notes: >
      Drafted with an LLM. DPR Table 2 (p.5), row "None BM25", first NQ column: 59.1.
      Contriever Table 1 (p.7): "BM25 (Ma et al., 2021) - 62.9 78.3" (R@5 R@20 R@100 on
      NaturalQuestions). Needs both papers: neither one quotes the other's BM25 number.
      The "why" part is the reason given above (different sources), not a claim either
      paper makes; a judge should accept any answer that gives both numbers.

  - id: q009
    type: negation
    author: llm
    question: >
      Which papers in the collection never mention BM25 in their text (main body and
      appendices; the bibliography doesn't count)?
    answer: >
      Ten: Attention Is All You Need, BERT, Sentence-BERT, GPT-3, LoRA, Chain-of-Thought,
      InstructGPT, ReAct, Lost in the Middle and Self-RAG.
    gold:
      - paper: "1706.03762"
        pages: []
      - paper: "1810.04805"
        pages: []
      - paper: "1908.10084"
        pages: []
      - paper: "2005.14165"
        pages: []
      - paper: "2106.09685"
        pages: []
      - paper: "2201.11903"
        pages: []
      - paper: "2203.02155"
        pages: []
      - paper: "2210.03629"
        pages: []
      - paper: "2307.03172"
        pages: []
      - paper: "2310.11511"
        pages: []
    notes: >
      Drafted with an LLM: a case-insensitive search for "bm25", "bm-25" and "okapi" finds
      no match in these ten (references already stripped by ingestion). Every other paper
      has at least one: REALM, Atlas, Toolformer and the survey have exactly one each, so
      those are the ones to double-check in the PDFs. To verify in a PDF viewer, search
      "BM25" and ignore hits in the references.

  - id: q010
    type: unanswerable
    author: llm
    question: How much money, in US dollars, did it cost to train GPT-3 175B?
    answer: >
      The papers don't say. The GPT-3 paper gives the training compute (several thousand
      petaflop/s-days) and says retraining was too costly, but no dollar figure.
    gold: []
    notes: >
      Drafted with an LLM. A widely repeated outside estimate exists, so a model answering
      from memory will be tempted to give a number: this tests whether a method sticks to
      the collection. Checked: no "$... million" or "training cost" figure in any paper;
      GPT-3 p.39 says "several thousand petaflop/s-days", p.9 and p.31 "due to the cost of
      training" with no amount.

# ---------------------------------------------------------------------------------- #
# #19: ten harder questions (q011-q020). Drafted with an LLM on 2026-10-26 at Swayam's
# request (author: llm), each checked in the ingested text of every candidate
# paper; to be verified by Swayam in the PDFs. To limit the grep bias of q003-q010,
# they need two conditions at once, use descriptions instead of the papers' phrases
# where that stays unambiguous, hinge on tables, footnotes and appendices, and plant
# near-misses: papers that mention the thing without doing it.
# ---------------------------------------------------------------------------------- #

  - id: q011
    type: multi_filter
    author: llm
    question: >
      Which papers report their own results both on a multi-hop question answering
      benchmark built from Wikipedia (HotpotQA) and on a claim fact-checking benchmark
      (FEVER)?
    answer: >
      Four: BEIR, Contriever, Atlas and ReAct. Near misses: RAG and Self-RAG use FEVER
      but not HotpotQA (Self-RAG only in its training data); the RAG survey lists both
      but runs no experiments.
    gold:
      - paper: "2104.08663"  # BEIR: both are datasets of the benchmark (Table 1)
        pages: [4]
      - paper: "2112.09118"  # Contriever: HotpotQA and FEVER rows of its BEIR table
        pages: [8]
      - paper: "2208.03299"  # Atlas: KILT table, columns FEV and HoPo
        pages: [15]
      - paper: "2210.03629"  # ReAct: Table 1, PaLM-540B prompting on HotpotQA and Fever
        pages: [5]
    notes: >
      Hard because no single passage names both datasets with results for both, and
      BEIR/Contriever report them only as rows of a large table. Quotes: Atlas p.15
      "exact match (Natural Questions, HotpotQA, TriviaQA) ... accuracy (AIDA, FEVER";
      ReAct p.5 "Table 1: PaLM-540B prompting results on HotpotQA and Fever".

  - id: q012
    type: multi_filter
    author: llm
    question: >
      Which papers report their own results on both the trivia-quiz question set
      (TriviaQA) and the questions collected through Google Suggest and answered with
      Freebase (WebQuestions)?
    answer: >
      Four: DPR, RAG, GPT-3 and Toolformer. Near misses: REALM evaluates on WebQuestions
      but not TriviaQA; Contriever, Atlas and Self-RAG on TriviaQA but not WebQuestions;
      BEIR names both only as the training data of a DPR model it evaluates; BERT uses
      TriviaQA only as extra fine-tuning data for SQuAD.
    gold:
      - paper: "2004.04906"  # DPR: Table 2 (retrieval) and Table 4 (end-to-end QA)
        pages: [5, 8]
      - paper: "2005.11401"  # RAG: Table 1, columns NQ TQA WQ CT
        pages: [6]
      - paper: "2005.14165"  # GPT-3: "NaturalQS WebQS TriviaQA" table
        pages: [13]
      - paper: "2302.04761"  # Toolformer: Table 5, WebQS NQ TriviaQA
        pages: [7]
    notes: >
      Hard because BEIR mentions both datasets in one sentence (p.6: "trained on four QA
      datasets ... NQ, TriviaQA, WebQuestions and CuratedTREC") without evaluating on
      them, a trap for keyword search, and BERT mentions TriviaQA (p.6) as augmentation.

  - id: q013
    type: multi_filter
    author: llm
    question: >
      Which papers state that their experiments ran on NVIDIA V100 GPUs and also score
      retrieval with a rank-sensitive metric such as MRR or nDCG?
    answer: >
      Two: ColBERT (Tesla V100; MRR@10) and BEIR (latency measured on a Tesla V100;
      nDCG@10). Near misses: Sentence-BERT, RAG, GPT-3 and LoRA name V100s but use no
      ranking metric; Contriever and HyDE report nDCG but don't name the GPU type; DPR
      says only "eight 32GB GPUs".
    gold:
      - paper: "2004.12832"  # ColBERT p.1: "use a Tesla V100 GPU" + MRR@10 figure
        pages: [1, 8]
      - paper: "2104.08663"  # BEIR p.8: "a single Nvidia Tesla V100"; nDCG@10 results p.7
        pages: [7, 8]
    notes: >
      Hard because the hardware sits in setup details, footnotes and latency tables,
      far from the results, and several papers satisfy one condition only.

  - id: q014
    type: multi_filter
    author: llm
    question: >
      Which papers evaluate on arithmetic word-problem datasets and, in at least one
      experiment, let the model hand its calculations to an external calculator?
    answer: >
      Two: Chain-of-Thought (GSM8K and others; an appendix experiment adds a Python
      calculator to the generated equations) and Toolformer (ASDiv, SVAMP, MAWPS; a
      calculator API is one of its tools). Near miss: GPT-3 tests arithmetic, but as
      synthetic sums and without any calculator.
    gold:
      - paper: "2201.11903"  # CoT: GSM8K p.1; external calculator, appendix p.20
        pages: [1, 20]
      - paper: "2302.04761"  # Toolformer: math datasets + calculator, p.6
        pages: [6]
    notes: >
      Hard because Chain-of-Thought's calculator appears only in an appendix (p.20: "we
      can further add a Python program as an external calculator"), and its main text
      mentions "calculator error" (p.5) as an error type, not a tool.

  - id: q015
    type: multi_filter
    author: llm
    question: >
      Which papers both use the FAISS library and report a measured retrieval speed or
      latency (queries per second, milliseconds per query)?
    answer: >
      Three: DPR (995 questions per second with a FAISS index), ColBERT (query latency
      in milliseconds, faiss-based candidate generation) and BEIR (retrieval latency
      table). Near miss: RAG uses FAISS but only says it is "sufficiently fast on CPU",
      without a measurement.
    gold:
      - paper: "2004.04906"
        pages: [7]
      - paper: "2004.12832"
        pages: [8]
      - paper: "2104.08663"
        pages: [8]
    notes: >
      Builds on q007's FAISS set. Hard because RAG's appendix (p.17) talks about speed
      in words, which a reader can easily count as a measurement.

  - id: q016
    type: negation
    author: llm
    question: >
      Of the papers that report their own results on Natural Questions (see q006),
      which do NOT report results on TriviaQA?
    answer: >
      Three: REALM, BEIR and Lost in the Middle. (DPR, RAG, GPT-3, Contriever, Atlas and
      Toolformer report both.)
    gold:
      - paper: "2002.08909"
        pages: []
      - paper: "2104.08663"
        pages: []
      - paper: "2307.03172"
        pages: []
    notes: >
      Group: q006's nine papers. BEIR is the trap: it names TriviaQA (p.6) only as
      training data of a model it evaluates. REALM and Lost in the Middle never
      mention TriviaQA.

  - id: q017
    type: negation
    author: llm
    question: >
      Of Chain-of-Thought, ReAct, HyDE, Lost in the Middle, Atlas and Toolformer, which
      do NOT run any experiment with Google's PaLM model themselves?
    answer: >
      Four: HyDE, Lost in the Middle, Atlas and Toolformer. Chain-of-Thought and ReAct
      prompt PaLM-540B. Atlas mentions PaLM several times, but only compares with
      PaLM's published numbers.
    gold:
      - paper: "2212.10496"
        pages: []
      - paper: "2307.03172"
        pages: []
      - paper: "2208.03299"
        pages: []
      - paper: "2302.04761"
        pages: []
    notes: >
      Hard because Atlas names PaLM on p.2, p.13, p.14 and p.19 ("outperforming PaLM
      ... a 540B parameter model"), which reads like a use. ReAct p.3: "a frozen large
      language model, PaLM-540B ... is prompted".

  - id: q018
    type: negation
    author: llm
    question: >
      Of the papers that report BLEU scores from their own experiments, which do NOT
      use BLEU to score machine translation?
    answer: >
      Two: RAG (BLEU for MS-MARCO answer generation and Jeopardy question generation)
      and LoRA (BLEU on the E2E NLG and DART data-to-text tasks). The Transformer,
      GPT-3 and InstructGPT use it for translation.
    gold:
      - paper: "2005.11401"
        pages: [6]
      - paper: "2106.09685"
        pages: [7, 21]
    notes: >
      Hard because BLEU is strongly associated with translation, and InstructGPT's
      BLEU is hidden in an appendix (p.49, WMT French to English), so it belongs to
      the group but not the answer. The survey lists BLEU without experiments.

  - id: q019
    type: negation
    author: llm
    question: >
      Of the papers that report their own results on Natural Questions (see q006),
      which do NOT use a learned (neural) retriever in those experiments?
    answer: >
      Two: GPT-3 (closed-book, no retrieval at all) and Toolformer (its search tool is
      a BM25 retriever over Wikipedia; its learned QA tool is disabled for these
      datasets). The other seven use dense retrievers, e.g. Lost in the Middle
      retrieves with Contriever.
    gold:
      - paper: "2005.14165"
        pages: [13]
      - paper: "2302.04761"
        pages: [4, 7]
    notes: >
      Hard because Toolformer does retrieve, just not with a learned retriever (p.4:
      "As our search engine, we use a BM25 retriever"), and its QA tool is an Atlas
      model that is not used here (p.7: "this would make solving the tasks trivial").

  - id: q020
    type: negation
    author: llm
    question: >
      Of the papers from 2022 or later that run experiments, which do NOT use any
      OpenAI model (GPT-3, InstructGPT, ChatGPT, GPT-4) in them?
    answer: >
      Only Atlas. It mentions GPT-3 often, but only compares with GPT-3's published
      results. Chain-of-Thought, InstructGPT, ReAct (in an appendix), HyDE, Toolformer
      (the davinci model, in a footnote), Lost in the Middle and Self-RAG all use one.
    gold:
      - paper: "2208.03299"
        pages: []
    notes: >
      Group: arXiv IDs from 2201 on, minus the survey (no experiments). Hard because
      proving the negative for Atlas means reading every GPT-3 mention (p.8, p.13), and
      the positives for ReAct and Toolformer are in an appendix and a footnote.
